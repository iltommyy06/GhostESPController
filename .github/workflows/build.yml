name: Build iOS IPA

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Compila e pacchettizza iOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Imposta Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Verifica presenza file sorgente
        run: |
          echo "Controllo file del progetto..."
          ls -la
          test -f GhostESPApp.swift && echo "GhostESPApp.swift trovato."
          test -f ContentView.swift && echo "ContentView.swift trovato."

      - name: Test sintassi Swift
        run: |
          swiftc -typecheck GhostESPApp.swift GhostESPManager.swift ContentView.swift
          echo "Sintassi del codice Swift verificata con successo!"
