name: Build iOS IPA

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Compila e pacchettizza iOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Imposta Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Conferma file presenti
        run: |
          echo "Verifica integrità file di progetto..."
          ls -la

      - name: Validazione sintassi Swift
        run: |
          # Esegue un controllo di sintassi mirato sui singoli file sorgente
          swiftc -parse GhostESPApp.swift GhostESPManager.swift ContentView.swift
          echo "Controllo sintassi completato con successo!"
