name: Build iOS IPA

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Compila e pacchettizza iOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Imposta Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Crea struttura di progetto Xcode
        run: |
          mkdir -p GhostESPController.xcodeproj
          cat << 'EOF' > GhostESPController.xcodeproj/project.pbxproj
          // Progetto Xcode minimale per compilazione cloud
          {
              archiveVersion = 1;
              classes = { };
              objectVersion = 56;
              objects = { };
              rootObject = 0000000100000000 /* Project object */;
          }
          EOF

      - name: Compilazione simulatore / binario
        run: |
          swiftc GhostESPApp.swift GhostESPManager.swift ContentView.swift -o GhostAppBin -target arm64-apple-ios14.0-simulator
          echo "Compilazione eseguita con successo"

      - name: Salva artefatti di build
        uses: actions/upload-artifact@v4
        with:
          name: app-binario
          path: GhostAppBin
