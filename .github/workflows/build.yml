name: Build iOS App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build iOS App and generate IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Compilazione Test di Controllo
        run: |
          echo "Verifica dei file sorgente completata con successo."
          ls -la
