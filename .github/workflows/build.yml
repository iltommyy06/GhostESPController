name: Build iOS IPA

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Compila e pacchettizza iOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Imposta Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Validazione sintassi Swift
        run: |
          swiftc -parse GhostESPApp.swift GhostESPManager.swift ContentView.swift
          echo "Controllo sintassi completato con successo!"

      - name: Salva file sorgente come pacchetto scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: Codice-Sorgente-App
          path: |
            GhostESPApp.swift
            GhostESPManager.swift
            ContentView.swift
            Info.plist
